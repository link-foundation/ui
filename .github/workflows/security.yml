name: Security

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

# Least-privilege default; jobs escalate individually when needed.
permissions:
  contents: read

# Provide Git config to actions/checkout itself; checkout runs git init before
# any workflow step can configure Git.
env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CODEQL_ACTION_DIFF_INFORMED_QUERIES: 'false'
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-codeql-${{ matrix.language }}
      cancel-in-progress: true
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          output: codeql-results

      - name: Require clean CodeQL results
        if: ${{ !cancelled() }}
        run: node scripts/check-codeql-results.mjs codeql-results

      - name: Preserve CodeQL reports
        if: ${{ !cancelled() }}
        uses: ./.github/actions/artifact-transport
        with:
          name: codeql-results-${{ matrix.language }}
          path: codeql-results
          if-no-files-found: error

  dependency-graph:
    name: Dependency Graph Prerequisite
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-dependency-graph
      cancel-in-progress: true
    outputs:
      enabled: ${{ steps.graph.outputs.enabled }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check dependency graph availability
        id: graph
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REQUIRE_GRAPH: ${{ github.event_name != 'pull_request' && '1' || '0' }}
        run: |
          mode=()
          if [[ "$REQUIRE_GRAPH" == 1 ]]; then mode=(--require); fi
          bash scripts/check-dependency-graph.sh "$BASE_SHA" "$HEAD_SHA" "${mode[@]}"

  dependency-review:
    name: Dependency Review
    needs: [dependency-graph]
    if: github.event_name == 'pull_request' && needs.dependency-graph.outputs.enabled == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-dependency-review
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
          # Licence policy (requirement R25): only permissive
          # licences are allowed, so GPL-family, AGPL, non-commercial and
          # "source available" licences fail the review.
          allow-licenses: >-
            MIT, ISC, BSD-2-Clause, BSD-3-Clause, Apache-2.0, 0BSD,
            Unlicense, CC0-1.0, CC-BY-4.0, BlueOak-1.0.0, Python-2.0
          # Existing dependencies outside the list above, reviewed one by one:
          # - @resvg/resvg-js*: MPL-2.0 (file-level copyleft), transitive dev-only SVG
          #   renderer for preview images; never bundled or modified.
          # - @axe-core/playwright, axe-core: MPL-2.0, dev/CI-only accessibility
          #   audit for the Playwright UI tests (docs/testing-ui.md); never
          #   imported by a published package, bundled or modified.
          # - buffers, chainsaw: MIT/X11 (MIT wording, not an SPDX id) and no
          #   licence field; transitive deps of the artifact-transport action.
          # - truncate-utf8-bytes: WTFPL (permissive), transitive dependency
          #   of examples/universal-app (via sanitize-filename).
          # - @csstools/color-helpers, @csstools/css-syntax-patches-for-csstree:
          #   MIT-0 (MIT without the attribution clause), transitive dev-only
          #   dependencies of jsdom, used by the ui-convert DOM import tests.
          # - khroma: MIT (its licence file) but no licence field; transitive
          #   dependency of mermaid, the optional peer of ui-components, which
          #   is installed in this repository for its tests only.
          allow-dependencies-licenses: >-
            pkg:npm/%40axe-core/playwright,
            pkg:npm/axe-core,
            pkg:npm/%40resvg/resvg-js,
            pkg:npm/%40resvg/resvg-js-android-arm-eabi,
            pkg:npm/%40resvg/resvg-js-android-arm64,
            pkg:npm/%40resvg/resvg-js-darwin-arm64,
            pkg:npm/%40resvg/resvg-js-darwin-x64,
            pkg:npm/%40resvg/resvg-js-linux-arm-gnueabihf,
            pkg:npm/%40resvg/resvg-js-linux-arm64-gnu,
            pkg:npm/%40resvg/resvg-js-linux-arm64-musl,
            pkg:npm/%40resvg/resvg-js-linux-x64-gnu,
            pkg:npm/%40resvg/resvg-js-linux-x64-musl,
            pkg:npm/%40resvg/resvg-js-win32-arm64-msvc,
            pkg:npm/%40resvg/resvg-js-win32-ia32-msvc,
            pkg:npm/%40resvg/resvg-js-win32-x64-msvc,
            pkg:npm/buffers,
            pkg:npm/chainsaw,
            pkg:npm/truncate-utf8-bytes,
            pkg:npm/%40csstools/color-helpers,
            pkg:npm/%40csstools/css-syntax-patches-for-csstree,
            pkg:npm/khroma

  npm-audit:
    name: Audit npm lock (${{ matrix.directory }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-npm-audit-${{ matrix.directory }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        directory:
          [
            '.',
            examples/universal-app,
            examples/vue,
            .github/actions/artifact-transport,
          ]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Audit current lock
        working-directory: ${{ matrix.directory }}
        run: npm audit --package-lock-only --audit-level=high

  # Terminal status gate: runs even when the jobs above fail or are
  # cancelled, and turns a `timeout-minutes` kill (reported as cancelled)
  # into a red run. needs is derived and checked by the status-gate-coverage
  # job in workflows.yml.
  pipeline-status:
    name: Pipeline Status
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-pipeline-status
      cancel-in-progress: true
    # A status function is required: without one the gate inherits the
    # implicit "every dependency succeeded" condition and is skipped in
    # exactly the runs it exists to report.
    if: >-
      !cancelled()
    needs:
      - codeql
      - dependency-review
      - dependency-graph
      - npm-audit
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: Fail the run when a required job was cancelled or failed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          RUN_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          HEAD_REF: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.number) || github.ref }}
        run: bash scripts/check-pipeline-status.sh
