name: Kotlin

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/kotlin-quality.yml
    with:
      project-directory: kotlin
      additional-paths: |
        native/kotlin
        packages/ui-kotlin
        examples/kotlin
        native/parity
        docs/spec
        packages/ui-tokens/tests/golden
        docs/case-studies/issue-1/samples
        .github/workflows/kotlin.yml
        .github/workflows/kotlin-quality.yml
        .github/workflows/publish-kotlin.yml
        scripts/check-pipeline-status.sh
        scripts/read-job-cancel-in-progress.sh
      fast-tasks: :links-notation-kotlin:compileTestKotlinJvm :links-notation-kotlin:compileTestKotlinJs
      test-tasks: :links-notation-kotlin:jvmTest :links-notation-kotlin:jsTest :links-notation-kotlin:wasmJsTest
