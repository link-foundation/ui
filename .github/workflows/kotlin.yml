name: Kotlin

# The Kotlin Multiplatform Links Notation parser (native/kotlin/links-notation,
# issue #31). Its tests read the upstream parity corpus (native/parity) and the
# ui-dialect/0 parser vectors (docs/spec), so a change to either runs them too.
#
# The Compose renderer (packages/ui-kotlin, issue #32) and its desktop example
# (examples/kotlin) build on that parser; their tests read the shared fixtures
# (docs/spec), the issue #1 sample document and the ui-tokens golden Kotlin
# output, so a change to any of those runs them too.
on:
  push:
    branches:
      - main
    paths:
      - 'native/kotlin/**'
      - 'native/parity/**'
      - 'docs/spec/**'
      - 'packages/ui-kotlin/**'
      - 'examples/kotlin/**'
      - 'packages/ui-tokens/tests/golden/**'
      - 'docs/case-studies/issue-1/samples/**'
      - '.github/workflows/kotlin.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'native/kotlin/**'
      - 'native/parity/**'
      - 'docs/spec/**'
      - 'packages/ui-kotlin/**'
      - 'examples/kotlin/**'
      - 'packages/ui-tokens/tests/golden/**'
      - 'docs/case-studies/issue-1/samples/**'
      - '.github/workflows/kotlin.yml'
  workflow_dispatch:

# Least-privilege default; these jobs only need to read the checked-out tree.
permissions:
  contents: read

# Provide Git config to actions/checkout itself; checkout runs git init before
# any workflow step can configure Git.
env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  jvm-js:
    name: JVM, JS and Wasm tests
    runs-on: ubuntu-24.04
    # Typical run: about 4min (Gradle, Kotlin/JS and Kotlin/Wasm toolchains,
    # three test runs). 20min stops a hung download from blocking the run.
    timeout-minutes: 20
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-jvm-js
      cancel-in-progress: true
    permissions:
      contents: read
    defaults:
      run:
        working-directory: native/kotlin/links-notation
    # The Android target is configured only where an Android SDK is found;
    # this job leaves it out so the other targets do not depend on it (the
    # android job below builds and tests it).
    env:
      ANDROID_HOME: ''
      ANDROID_SDK_ROOT: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Run the JVM, JS and Wasm tests
        run: ./gradlew --no-daemon --console=plain jvmTest jsTest wasmJsTest

      - name: Show how many tests each target ran
        if: ${{ !cancelled() }}
        run: sh test-summary.sh

  android:
    name: Android host tests
    runs-on: ubuntu-24.04
    # Typical run: about 4min (Gradle, Android Gradle plugin, one test run).
    timeout-minutes: 20
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-android
      cancel-in-progress: true
    permissions:
      contents: read
    defaults:
      run:
        working-directory: native/kotlin/links-notation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # The hosted image ships an Android SDK and sets ANDROID_HOME; the
      # build applies the Android target only when it finds one.
      - name: Build the Android library and run its host tests
        run: ./gradlew --no-daemon --console=plain assemble testAndroidHostTest

      - name: Show how many tests each target ran
        if: ${{ !cancelled() }}
        run: sh test-summary.sh

  ios:
    name: iOS simulator tests
    runs-on: macos-15
    # Typical run: about 8min (Kotlin/Native toolchain download, compile,
    # simulator boot). 30min stops a hung simulator from blocking the run.
    timeout-minutes: 30
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-ios
      cancel-in-progress: true
    permissions:
      contents: read
    defaults:
      run:
        working-directory: native/kotlin/links-notation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Run the iOS simulator tests
        run: ./gradlew --no-daemon --console=plain iosSimulatorArm64Test

      - name: Show how many tests each target ran
        if: ${{ !cancelled() }}
        run: sh test-summary.sh

  ui-kotlin:
    name: ui-kotlin desktop tests and example
    runs-on: ubuntu-24.04
    # Typical run: about 6min (Gradle, Compose Multiplatform, the desktop
    # tests and the example build). 25min stops a hung download from
    # blocking the run; a hung Compose test fails after 10min (Test.timeout).
    timeout-minutes: 25
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-ui-kotlin
      cancel-in-progress: true
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/ui-kotlin
    # The Android target is configured only where an Android SDK is found;
    # this job leaves it out (the ui-kotlin-android job below builds it).
    env:
      ANDROID_HOME: ''
      ANDROID_SDK_ROOT: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # Every test: render-tree snapshots of the shared fixtures, themes,
      # actions and UiView in a headless Compose window.
      - name: Run ./gradlew check
        run: ./gradlew --no-daemon --console=plain check

      # examples/kotlin is its own build (it includes this one); building it
      # compiles Main.kt against the library.
      - name: Build the desktop example
        working-directory: examples/kotlin
        run: ../../packages/ui-kotlin/gradlew --no-daemon --console=plain build

  ui-kotlin-android:
    name: ui-kotlin Android build
    runs-on: ubuntu-24.04
    # Typical run: about 5min (Gradle, Android Gradle plugin, one build).
    timeout-minutes: 25
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-ui-kotlin-android
      cancel-in-progress: true
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/ui-kotlin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # The hosted image ships an Android SDK and sets ANDROID_HOME; the
      # build applies the Android library target only when it finds one.
      - name: Build the Android library
        run: ./gradlew --no-daemon --console=plain assemble

  # Terminal status gate: runs even when the jobs above fail or are
  # cancelled, and turns a `timeout-minutes` kill (reported as cancelled)
  # into a red run. needs is derived and checked by the status-gate-coverage
  # job in workflows.yml.
  pipeline-status:
    name: Pipeline Status
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-pipeline-status
      cancel-in-progress: true
    # A status function is required: without one the gate inherits the
    # implicit "every dependency succeeded" condition and is skipped in
    # exactly the runs it exists to report.
    if: >-
      !cancelled()
    needs:
      - jvm-js
      - android
      - ios
      - ui-kotlin
      - ui-kotlin-android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'

      - name: Fail the run when a required job was cancelled or failed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          RUN_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          HEAD_REF: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.number) || github.ref }}
        run: bash scripts/check-pipeline-status.sh
