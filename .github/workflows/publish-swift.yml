name: Publish Swift packages

on:
  pull_request:
    paths:
      - '.github/workflows/publish-swift.yml'
      - 'scripts/publish-swift.py'
      - 'experiments/check-swift-publication.py'
      - 'VERSION'
      - 'LICENSE'
      - 'Package.swift'
      - 'native/swift/LinksNotation/**'
      - 'packages/ui-swift/**'
      - 'examples/swift/**'
      - 'docs/spec/**'
      - 'docs/case-studies/issue-1/samples/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify versioned SwiftPM dependencies
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: tryswift/setup-swift@ce5fe39afee72fd792fabab6db8ec3005962daf7 # v1.2.0
        with:
          swift-version: '6.4.1'
          use-preinstalled: 'true'

      - name: Test both packages and build independent SwiftPM consumers
        run: python3 -B scripts/publish-swift.py verify

      - name: Test first publication and recovery against local Git remotes
        if: runner.os == 'Linux'
        run: python3 -B experiments/check-swift-publication.py

  publish:
    name: Push SwiftPM tags and create GitHub releases
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'link-foundation/ui'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: swift-release
    concurrency:
      group: publish-swift
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Publish the validated revision
        env:
          GH_TOKEN: ${{ github.token }}
          PARSER_RELEASE_TOKEN: ${{ secrets.PARSER_RELEASE_TOKEN }}
        run: python3 -B scripts/publish-swift.py publish

  verify-published:
    name: Resolve and run consumers against GitHub tags
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: tryswift/setup-swift@ce5fe39afee72fd792fabab6db8ec3005962daf7 # v1.2.0
        with:
          swift-version: '6.4.1'
          use-preinstalled: 'true'

      - run: python3 -B scripts/publish-swift.py verify-published
