name: Kotlin quality

# Based on the merged template's read-only workflow.
# https://github.com/link-foundation/kotlin-ai-driven-development-pipeline-template/blob/9ba20ee1a6ce339057491ed4090f951ddfd937f3/.github/workflows/kotlin-quality.yml
on:
  workflow_call:
    inputs:
      project-directory:
        description: Gradle coordinator directory relative to the checkout.
        type: string
        required: true
      additional-paths:
        description: Newline-separated paths to Kotlin builds and shared inputs.
        type: string
        required: true
      fast-tasks:
        description: Gradle compilation and validation tasks, separated by spaces.
        type: string
        default: ''
      test-tasks:
        description: Gradle parser test tasks, separated by spaces.
        type: string
        required: true

# Least-privilege default; these jobs only need to read the checked-out tree.
permissions:
  contents: read

# Provide Git config to actions/checkout itself; checkout runs git init before
# any workflow step can configure Git.
env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  plan:
    name: Plan Kotlin checks
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-kotlin-plan
      cancel-in-progress: true
    outputs:
      kotlin: ${{ steps.paths.outputs.kotlin }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'
          package-manager-cache: false

      - name: Detect changes to Kotlin inputs
        id: paths
        env:
          PROJECT_DIRECTORY: ${{ inputs.project-directory }}
          ADDITIONAL_PATHS: ${{ inputs.additional-paths }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.merge_group.base_sha || github.event.before }}
        run: node "$PROJECT_DIRECTORY/scripts/ci.mjs"

  jvm-js:
    name: JVM, JS and Wasm tests
    needs: plan
    if: needs.plan.outputs.kotlin == 'true'
    runs-on: ubuntu-24.04
    # Typical run: about 4min (Gradle, Kotlin/JS and Kotlin/Wasm toolchains,
    # three test runs). 20min stops a hung download from blocking the run.
    timeout-minutes: 20
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-jvm-js
      cancel-in-progress: true
    permissions:
      contents: read
    # The Android target is configured only where an Android SDK is found;
    # this job leaves it out so the other targets do not depend on it (the
    # android job below builds and tests it).
    env:
      ANDROID_HOME: ''
      ANDROID_SDK_ROOT: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Run the JVM, JS and Wasm tests
        working-directory: ${{ inputs.project-directory }}
        env:
          FAST_TASKS: ${{ inputs.fast-tasks }}
          TEST_TASKS: ${{ inputs.test-tasks }}
        shell: bash
        run: |
          read -r -a fast <<< "$FAST_TASKS"
          read -r -a tests <<< "$TEST_TASKS"
          ./gradlew --no-daemon --console=plain "${fast[@]}" "${tests[@]}"

      - name: Show how many tests each target ran
        if: ${{ !cancelled() }}
        working-directory: ${{ inputs.project-directory }}/parser-tests
        run: sh ../scripts/test-summary.sh

  android:
    name: Android host tests
    needs: plan
    if: needs.plan.outputs.kotlin == 'true'
    runs-on: ubuntu-24.04
    # Typical run: about 4min (Gradle, Android Gradle plugin, one test run).
    timeout-minutes: 20
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-android
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          # The published Android parser contains Java 26 class files.
          java-version: '26'

      # The hosted image ships an Android SDK and sets ANDROID_HOME; the
      # build applies the Android target only when it finds one.
      - name: Run the parser’s Android host tests
        working-directory: ${{ inputs.project-directory }}
        run: ./gradlew --no-daemon --console=plain :parser-tests:testAndroidHostTest

      - name: Show how many tests each target ran
        if: ${{ !cancelled() }}
        working-directory: ${{ inputs.project-directory }}/parser-tests
        run: sh ../scripts/test-summary.sh

  ios:
    name: iOS simulator tests
    needs: plan
    if: needs.plan.outputs.kotlin == 'true'
    runs-on: macos-15
    # Typical run: about 8min (Kotlin/Native toolchain download, compile,
    # simulator boot). 30min stops a hung simulator from blocking the run.
    timeout-minutes: 30
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-ios
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Run the iOS simulator tests
        working-directory: ${{ inputs.project-directory }}
        run: ./gradlew --no-daemon --console=plain :parser-tests:iosSimulatorArm64Test

      - name: Show how many tests each target ran
        if: ${{ !cancelled() }}
        working-directory: ${{ inputs.project-directory }}/parser-tests
        run: sh ../scripts/test-summary.sh

  ui-kotlin:
    name: ui-kotlin desktop tests
    needs: plan
    if: needs.plan.outputs.kotlin == 'true'
    runs-on: ubuntu-24.04
    # Typical run: about 6min (Gradle, Compose Multiplatform, the desktop
    # tests). 25min stops a hung download from
    # blocking the run; a hung Compose test fails after 10min (Test.timeout).
    timeout-minutes: 25
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-ui-kotlin
      cancel-in-progress: true
    permissions:
      contents: read
    # The Android target is configured only where an Android SDK is found;
    # this job leaves it out (the ui-kotlin-android job below builds it).
    env:
      ANDROID_HOME: ''
      ANDROID_SDK_ROOT: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # Every test: render-tree snapshots of the shared fixtures, themes,
      # actions and UiView in a headless Compose window.
      - name: Run ./gradlew check
        working-directory: ${{ inputs.project-directory }}
        run: ./gradlew --no-daemon --console=plain :ui-kotlin:check

      - name: Show how many tests ran
        if: ${{ !cancelled() }}
        working-directory: packages/ui-kotlin
        run: sh ../../kotlin/scripts/test-summary.sh

  ui-kotlin-android:
    name: ui-kotlin signed publication and desktop consumer
    needs: plan
    if: needs.plan.outputs.kotlin == 'true'
    runs-on: ubuntu-24.04
    # Build both targets, stage their signed artifacts and build the example.
    timeout-minutes: 25
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-ui-kotlin-android
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Stage a signed first publication
        working-directory: packages/ui-kotlin
        shell: bash
        run: |
          export GNUPGHOME
          GNUPGHOME="$(mktemp -d)"
          chmod 700 "$GNUPGHOME"
          gpg --batch --pinentry-mode loopback --passphrase '' \
            --quick-generate-key 'ui-kotlin CI <ui-kotlin@example.invalid>' rsa2048 sign 1d
          export ORG_GRADLE_PROJECT_signingInMemoryKey
          ORG_GRADLE_PROJECT_signingInMemoryKey="$(gpg --batch --armor --export-secret-keys)"
          export ORG_GRADLE_PROJECT_signingInMemoryKeyPassword=''
          ./gradlew --no-daemon --no-configuration-cache --console=plain \
            -PuiKotlinRequireAndroid=true publishAllPublicationsToStagingRepository

          cd build/staging-repository/io/github/link-foundation/kotlin
          for artifact in ui-kotlin ui-kotlin-desktop ui-kotlin-android; do
            ls "$artifact"/*/"$artifact"-*.pom "$artifact"/*/"$artifact"-*.module \
              "$artifact"/*/"$artifact"-*-sources.jar "$artifact"/*/"$artifact"-*-javadoc.jar
          done
          for file in */*/*.pom */*/*.module */*/*.jar */*/*.aar; do
            gpg --batch --verify "$file.asc" "$file"
          done

      - name: Build the desktop example against the staged artifacts
        working-directory: examples/kotlin
        run: |
          ../../packages/ui-kotlin/gradlew --no-daemon --console=plain \
            -PuiKotlinStagingRepository="$GITHUB_WORKSPACE/packages/ui-kotlin/build/staging-repository" build

  # Terminal status gate: runs even when the jobs above fail or are
  # cancelled, and turns a `timeout-minutes` kill (reported as cancelled)
  # into a red run. needs is derived and checked by the status-gate-coverage
  # job in workflows.yml.
  pipeline-status:
    name: Pipeline Status
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-pipeline-status
      cancel-in-progress: true
    # A status function is required: without one the gate inherits the
    # implicit "every dependency succeeded" condition and is skipped in
    # exactly the runs it exists to report.
    if: >-
      !cancelled()
    needs:
      - plan
      - jvm-js
      - android
      - ios
      - ui-kotlin
      - ui-kotlin-android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'

      # The shared status script below classifies cancelled jobs.
      - name: Check that Gradle jobs match the plan
        if: needs.plan.result == 'success'
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        shell: bash
        run: |
          jq -e '
            .plan.outputs.kotlin as $kotlin
            | ($kotlin == "true" or $kotlin == "false")
              and (del(.plan) | all(.[];
                if .result == "cancelled" then true
                elif $kotlin == "true" then .result == "success"
                else .result == "skipped" end))
          ' <<< "$NEEDS_JSON"

      - name: Fail the run when a required job was cancelled or failed
        if: ${{ !cancelled() }}
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          WORKFLOW_FILE: .github/workflows/kotlin-quality.yml
          RUN_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          HEAD_REF: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.number) || github.ref }}
        run: bash scripts/check-pipeline-status.sh
