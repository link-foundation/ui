name: Swift

# The Swift Links Notation parser (native/swift/LinksNotation, issue #29):
# `swift test` on Linux, in the official Swift image, and on macOS. The tests
# read docs/spec/parser-vectors.json, so the spec fixtures trigger them too.
on:
  push:
    branches:
      - main
    paths:
      - 'native/swift/**'
      - 'docs/spec/**'
      - '.github/workflows/swift.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'native/swift/**'
      - 'docs/spec/**'
      - '.github/workflows/swift.yml'
  workflow_dispatch:

# Least-privilege default; these jobs only need to read the checked-out tree.
permissions:
  contents: read

# Provide Git config to actions/checkout itself; checkout runs git init before
# any workflow step can configure Git.
env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  swift-linux:
    name: swift test (Linux)
    runs-on: ubuntu-24.04
    container:
      # The official image (hub.docker.com/_/swift), pinned to a digest.
      image: swift@sha256:bca121f6eb59fd80340d1296887b2698ed8f3eb9eca7d80c181f8af769dc7ee0 # 6.4-noble
    # Typical run: ~2min (image pull, debug build, tests). 15min stops a hung
    # build from blocking the run.
    timeout-minutes: 15
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-swift-linux
      cancel-in-progress: true
    permissions:
      contents: read
    # Container jobs run `run:` blocks with sh, which has no [[ ]].
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The container user (root) does not own the runner's workspace.
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Show the toolchain
        run: swift --version

      - name: swift test
        working-directory: native/swift/LinksNotation
        run: swift test

  swift-macos:
    name: swift test (macOS)
    runs-on: macos-15
    # Typical run: ~3min (debug build, tests). 20min stops a hung build from
    # blocking the run.
    timeout-minutes: 20
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-swift-macos
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Show the toolchain
        run: swift --version

      - name: swift test
        working-directory: native/swift/LinksNotation
        run: swift test

  # Terminal status gate: runs even when the jobs above fail or are
  # cancelled, and turns a `timeout-minutes` kill (reported as cancelled)
  # into a red run. needs is derived and checked by the status-gate-coverage
  # job in workflows.yml.
  pipeline-status:
    name: Pipeline Status
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-pipeline-status
      cancel-in-progress: true
    # A status function is required: without one the gate inherits the
    # implicit "every dependency succeeded" condition and is skipped in
    # exactly the runs it exists to report.
    if: >-
      !cancelled()
    needs:
      - swift-linux
      - swift-macos
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: Fail the run when a required job was cancelled or failed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          RUN_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          HEAD_REF: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.number) || github.ref }}
        run: bash scripts/check-pipeline-status.sh
