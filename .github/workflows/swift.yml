name: Swift

# Keep the workflow visible when Swift can be skipped. The reusable lane
# classifies changed paths before installing a toolchain or compiling.
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  schedule:
    - cron: '19 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  root:
    uses: ./.github/workflows/swift-ci.yml
    with:
      mode: embedded
      pipeline-directory: swift/ci
      package-directory: '.'
      source-paths: |
        Package.swift
        Package.resolved
        native/swift/LinksNotation
        packages/ui-swift
        examples/swift
        docs/spec
        docs/case-studies/issue-1/samples

  parser:
    uses: ./.github/workflows/swift-ci.yml
    with:
      mode: embedded
      pipeline-directory: swift/ci
      package-directory: native/swift/LinksNotation
      source-paths: |
        native/swift/LinksNotation
        docs/spec

  ui-swift-macos:
    name: UiDemo render and screenshots (macOS)
    needs: root
    if: github.event_name != 'schedule' && needs.root.outputs.swift == 'true'
    runs-on: macos-15
    # Bound the demo build and capture of both appearances.
    timeout-minutes: 30
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-ui-swift-macos
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Materialize the validated tree
        env:
          GH_TOKEN: ${{ github.token }}
          CI_BASE: ${{ needs.root.outputs.base }}
        run: bash swift/ci/checkout-base.sh

      - uses: tryswift/setup-swift@ce5fe39afee72fd792fabab6db8ec3005962daf7 # v1.2.0
        with:
          swift-version: '6.4.1'
          use-preinstalled: 'true'

      - name: Render tree of the issue-1 sample
        run: swift run -j 2 UiDemo --dump

      # The app quits by itself once the window is captured; the alarm (perl
      # ships with macOS, GNU timeout does not) stops it if it never draws.
      - name: Screenshots of UiDemo (light and dark)
        run: |
          mkdir -p ui-swift-screenshots
          for appearance in light dark; do
            perl -e 'alarm 120; exec @ARGV' .build/debug/UiDemo --appearance "$appearance" \
              --screenshot "ui-swift-screenshots/uidemo-$appearance.png"
            test -s "ui-swift-screenshots/uidemo-$appearance.png"
          done
          file ui-swift-screenshots/*.png

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - uses: ./.github/actions/artifact-transport
        with:
          name: ui-swift-screenshots
          path: ui-swift-screenshots/
          if-no-files-found: error

  # Terminal status gate: runs even when the jobs above fail or are
  # cancelled, and turns a `timeout-minutes` kill (reported as cancelled)
  # into a red run. needs is derived and checked by the status-gate-coverage
  # job in workflows.yml.
  pipeline-status:
    name: Pipeline Status
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-pipeline-status
      cancel-in-progress: true
    # A status function is required: without one the gate inherits the
    # implicit "every dependency succeeded" condition and is skipped in
    # exactly the runs it exists to report.
    if: >-
      !cancelled()
    needs:
      - root
      - parser
      - ui-swift-macos
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: Fail the run when a required job was cancelled or failed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          RUN_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          HEAD_REF: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.number) || github.ref }}
        run: bash scripts/check-pipeline-status.sh
