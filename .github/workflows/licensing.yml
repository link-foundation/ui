name: Licensing

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# Least-privilege default; these jobs only need to read the checked-out tree.
permissions:
  contents: read

# Provide Git config to actions/checkout itself; checkout runs git init before
# any workflow step can configure Git.
env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  licensing:
    name: Asset records and REUSE
    runs-on: ubuntu-24.04
    # Typical run: <1min (npm ci, three node scripts, reuse lint). 10min stops
    # a hung pipx download from blocking the run.
    timeout-minutes: 10
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-licensing
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check asset records and REUSE.toml
        run: node scripts/check-assets.mjs

      - name: Check assets/ATTRIBUTIONS.md is up to date
        run: node scripts/render-attributions.mjs --check

      # Every used icon has a record with an allowed licence, no source is on
      # the avoid list, and src/icons/own-icons.js matches assets/icons/own/.
      - name: Check icon records and the own icon module
        run: node scripts/build-icons.mjs --check

      # reuse is GPL-3.0: it runs in CI only and is never shipped or imported.
      - name: REUSE lint
        run: pipx run --spec reuse==6.3.0 reuse lint

  # Terminal status gate: runs even when the jobs above fail or are
  # cancelled, and turns a `timeout-minutes` kill (reported as cancelled)
  # into a red run. needs is derived and checked by the status-gate-coverage
  # job in workflows.yml.
  pipeline-status:
    name: Pipeline Status
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-pipeline-status
      cancel-in-progress: true
    # A status function is required: without one the gate inherits the
    # implicit "every dependency succeeded" condition and is skipped in
    # exactly the runs it exists to report.
    if: >-
      !cancelled()
    needs:
      - licensing
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: Fail the run when a required job was cancelled or failed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          RUN_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          HEAD_REF: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.number) || github.ref }}
        run: bash scripts/check-pipeline-status.sh
