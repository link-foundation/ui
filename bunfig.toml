# Only maintained tests participate in the runtime matrix: `tests/` and
# `packages/*/tests/`. There is no single `root` (Bun accepts only one), so
# Bun discovers `*.test.js` from the repository root and the patterns below
# keep archives, examples and generated output out. Bun always skips
# `node_modules/`.
[test]
pathIgnorePatterns = [
  "**/dist/**",
  "**/build/**",
  "**/coverage/**",
  "dev/**",
  "docs/**",
  "examples/**",
  "experiments/**",
  # Playwright specs: `npm run test:ui` runs them.
  "tests/e2e/**",
  "packages/*/tests/e2e/**",
]
