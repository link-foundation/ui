<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Host chart and navigation</title>
    <link rel="icon" href="data:," />
    <script type="importmap">
      {
        "imports": {
          "@floating-ui/dom": "/node_modules/@floating-ui/dom/dist/floating-ui.dom.mjs",
          "@floating-ui/core": "/node_modules/@floating-ui/core/dist/floating-ui.core.mjs",
          "@floating-ui/utils": "/node_modules/@floating-ui/utils/dist/floating-ui.utils.mjs",
          "@floating-ui/utils/dom": "/node_modules/@floating-ui/utils/dist/floating-ui.utils.dom.mjs",
          "@link-foundation/ui-components/charts": "/packages/ui-components/src/charts/index.js",
          "@link-foundation/ui-core": "/packages/ui-core/src/index.js",
          "links-notation": "/node_modules/links-notation/dist/index.js",
          "d3-array": "/node_modules/d3-array/src/index.js",
          "d3-color": "/node_modules/d3-color/src/index.js",
          "d3-format": "/node_modules/d3-format/src/index.js",
          "d3-interpolate": "/node_modules/d3-interpolate/src/index.js",
          "d3-path": "/node_modules/d3-path/src/index.js",
          "d3-scale": "/node_modules/d3-scale/src/index.js",
          "d3-shape": "/node_modules/d3-shape/src/index.js",
          "d3-time": "/node_modules/d3-time/src/index.js",
          "d3-time-format": "/node_modules/d3-time-format/src/index.js",
          "internmap": "/node_modules/internmap/src/index.js",
          "@link-foundation/ui-store": "/packages/ui-store/src/index.js",
          "@link-foundation/ui-store/memory": "/packages/ui-store/src/memory.js",
          "@link-foundation/ui-style": "/packages/ui-style/src/index.js",
          "@link-foundation/ui-tokens": "/packages/ui-tokens/src/index.js",
          "@link-foundation/ui-tokens/themes": "/packages/ui-tokens/src/themes/index.js",
          "@link-foundation/ui-dom": "/packages/ui-dom/src/index.js",
          "@link-foundation/ui-components/layout": "/packages/ui-components/src/layout/index.js"
        }
      }
    </script>
    <style>
      :root {
        font:
          16px system-ui,
          sans-serif;
        color: #182541;
        background: #f0f3fb;
      }
      body {
        margin: 0;
      }
      main {
        max-width: 62rem;
        margin: auto;
        padding: 1.5rem;
      }
      nav {
        display: flex;
        overflow: auto;
        gap: 0.5rem;
        padding: 0.5rem;
        max-width: 25rem;
      }
      nav[data-more~='end'] {
        mask-image: linear-gradient(to right, black 90%, transparent);
      }
      nav:dir(rtl)[data-more~='end'] {
        mask-image: linear-gradient(to left, black 90%, transparent);
      }
      nav[data-more~='start']:not([data-more~='end']) {
        mask-image: linear-gradient(to left, black 90%, transparent);
      }
      nav:dir(rtl)[data-more~='start']:not([data-more~='end']) {
        mask-image: linear-gradient(to right, black 90%, transparent);
      }
      nav a {
        display: inline-flex;
        align-items: center;
        flex: none;
        padding: 0.6rem 0.8rem;
        color: #223764;
        background: white;
        border-radius: 0.4rem;
      }
      nav a[aria-current] {
        color: white;
        background: #223764;
      }
      .cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 18rem), 1fr));
        gap: 1rem;
        margin-top: 1rem;
      }
      article {
        min-width: 0;
        background: white;
        border-radius: 0.8rem;
        padding: 1rem;
      }
      h1 {
        margin: 0 0 0.75rem;
      }
      h2 {
        font-size: 1rem;
        margin-top: 0;
      }
      .tile-link {
        display: inline-block;
        margin-top: 0.6rem;
      }
      #clipped {
        position: fixed;
        right: 0;
        bottom: 0;
        overflow: hidden;
        clip-path: inset(0);
        padding: 0.8rem 0.3rem 0.3rem 0.8rem;
        border-radius: 0.8rem 0 0 0;
        background: #223764;
        color: white;
      }
      #host-chart {
        display: flex;
        align-items: end;
        justify-content: end;
        height: 5rem;
        gap: 0.5rem;
      }
      #host-chart button {
        min-width: 4rem;
        border: 1px solid #aac7fb;
        border-radius: 0.4rem;
        background: #dce8ff;
        color: #182541;
        padding: 0.3rem 0.6rem;
        font: inherit;
      }
      #host-chart button:focus-visible {
        outline: 2px solid white;
        outline-offset: -3px;
      }
      .ui-chart-tooltip.site-tooltip {
        background: #182541;
        color: white;
        border: 1px solid #90b7f4;
        border-radius: 0.5rem;
        padding: 0.55rem 0.75rem;
        white-space: normal;
      }
      .ui-chart-canvas {
        max-width: 100%;
      }
      #contributions .ui-chart-canvas svg {
        max-width: 100%;
        height: auto;
      }
      .site-tooltip strong {
        display: block;
      }
      #notes {
        margin-block: 4rem 20rem;
      }
    </style>
    <script type="module" src="host-visuals.js"></script>
  </head>
  <body>
    <main>
      <h1 id="top">Project activity</h1>
      <nav id="sections" aria-label="Sections">
        <a href="#top" aria-label="Back to top">
          <svg aria-hidden="true" width="20" height="20" viewBox="0 0 20 20">
            <path
              d="M4 12L10 6l6 6"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            />
          </svg>
        </a>
        <a href="#calendar">Contributions</a>
        <a href="#history">Project history</a>
        <a href="#totals">Totals</a>
        <a href="#notes">Data notes and sources</a>
      </nav>
      <div class="cards">
        <article>
          <h2 id="calendar">Contributions</h2>
          <ui-chart id="contributions" width="382" height="180"></ui-chart>
        </article>
        <article>
          <h2 id="history">Project history</h2>
          <ui-chart id="timeline" width="295" height="180"></ui-chart>
        </article>
        <article>
          <h2 id="totals">Totals</h2>
          <ui-stat-tile
            id="total"
            label="Total contributions"
            value="123456"
            notation="compact"
          ></ui-stat-tile>
          <a class="tile-link" href="#notes">Read the data notes</a>
        </article>
      </div>
      <section id="notes" aria-labelledby="notes-title">
        <h2 id="notes-title">Data notes</h2>
        <p>This sample records activity across a fixed observation period.</p>
      </section>
      <section id="clipped" aria-label="Latest samples">
        <h2>Latest samples</h2>
        <div id="host-chart"></div>
      </section>
    </main>
    <div id="chart-overlays"></div>
  </body>
</html>
