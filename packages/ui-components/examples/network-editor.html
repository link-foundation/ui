    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 1100px;
        margin: auto;
        padding: 1rem;
        color: #18202b;
        background: #f3f4f6;
      }
      #preview {
        background: white;
        max-width: 100%;
        height: 300px;
        overflow: hidden;
      }
      #preview svg {
        height: 100%;
        width: 100%;
      }
      h1 {
        font-size: 1.7rem;
      }
      @media (prefers-color-scheme: dark) {
        body {
          color: #f3f4f6;
          background: #111827;
        }
      }

  <body>
    <main>
      <h1>Network editor</h1>
      <p>
        This adapter example uses the existing circle renderer. The complete
        doublet renderer and collision solver are tracked in issues #227 and
        #228. The solver is unavailable until a host supplies it.
      </p>
      <div id="preview" role="img" aria-label="Network preview"></div>
      <div id="editor"></div>
    </main>
    <script type="module" src="./network-editor.js"></script>
  </body>
