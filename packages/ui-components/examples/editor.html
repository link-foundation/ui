<html lang="en">

    <link rel="stylesheet" href="../src/controls/styles.css" />
    <link rel="stylesheet" href="../src/editor/editor.css" />
    <style>
      :root {
        color-scheme: light dark;
        --color-primary: #6750a4;
        --color-on-primary: #ffffff;
        --color-surface: #fffbfe;
        --color-on-surface: #1d1b20;
        --color-on-surface-variant: #49454f;
        --color-surface-container: #f3edf7;
        --color-outline: #79747e;
        --color-error: #b3261e;
        --color-editor-string: #205b32;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --color-primary: #d0bcff;
          --color-on-primary: #381e72;
          --color-surface: #141218;
          --color-on-surface: #e6e0e9;
          --color-on-surface-variant: #cac4d0;
          --color-surface-container: #211f26;
          --color-outline: #938f99;
          --color-error: #f2b8b5;
          --color-editor-string: #98d5a5;
        }
      }
      body {
        margin: 24px auto;
        max-width: 960px;
        padding: 0 16px;
        font:
          16px/1.5 system-ui,
          sans-serif;
        color: var(--color-on-surface);
        background: var(--color-surface);
      }
      .examples {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-block: 16px;
      }
      .examples button {
        color: var(--color-on-surface);
        background: var(--color-surface-container);
        border: 1px solid var(--color-outline);
        border-radius: 4px;
        font: inherit;
        padding: 8px;
      }
      #saved {
        display: block;
        margin-block: 16px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>LiNo source editor</h1>
      <p>
        Drafts stay with each document. Save accepts empty text. Opening a file
        only edits its source.
      </p>
      <p>
        Press Escape then Tab to leave the editor. Arrow keys switch document
        tabs.
      </p>
      <div id="editor-host"></div>

      <div class="examples">
        <button id="external" type="button">Simulate external update</button>
        <button id="error" type="button">Show unclosed link</button>
        <button id="engine" type="button">Load optional Monaco</button>
      </div>
      <output id="saved" aria-live="polite"></output>
    </main>
    <script type="module" src="./editor.js"></script>
  </body>
</html>
