<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>link-view gallery</title>
    <link rel="icon" href="data:," />
    <!--
      No bundler and no CDN: the workspace packages load as ES modules from
      their src/ folders. Serve the repository with
      `node scripts/serve-static.mjs` and open
      http://127.0.0.1:4173/packages/ui-components/examples/link-view.html
      (`?renderer=canvas` and `?theme=dark` preset the switches).
    -->
    <script type="importmap">
      {
        "imports": {
          "@link-foundation/ui-core": "/packages/ui-core/src/index.js",
          "@link-foundation/ui-core/source": "/packages/ui-core/src/source.js",
          "@link-foundation/ui-store": "/packages/ui-store/src/index.js",
          "@link-foundation/ui-style": "/packages/ui-style/src/index.js",
          "@link-foundation/ui-tokens": "/packages/ui-tokens/src/index.js",
          "@link-foundation/ui-tokens/themes": "/packages/ui-tokens/src/themes/index.js",
          "@link-foundation/ui-dom": "/packages/ui-dom/src/index.js",
          "@link-foundation/ui-components/links-view": "/packages/ui-components/src/links-view/index.js",
          "@dagrejs/dagre": "/node_modules/@dagrejs/dagre/dist/dagre.esm.js",
          "d3-force": "/node_modules/d3-force/src/index.js",
          "d3-dispatch": "/node_modules/d3-dispatch/dist/d3-dispatch.mjs",
          "d3-quadtree": "/node_modules/d3-quadtree/dist/d3-quadtree.mjs",
          "d3-timer": "/node_modules/d3-timer/dist/d3-timer.mjs",
          "links-notation": "/node_modules/links-notation/dist/index.js"
        }
      }
    </script>
    <style>
      :root {
        color-scheme: light;
        --page-text: #1d1b20;
        --page-muted: #49454f;
        --page-background: #fffbfe;
        --page-border: #cac4d0;
        --page-code: #f3edf7;
      }
      :root[data-theme='dark'] {
        color-scheme: dark;
        --page-text: #e6e1e5;
        --page-muted: #cac4d0;
        --page-background: #1c1b1f;
        --page-border: #49454f;
        --page-code: #2b2930;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          color-scheme: dark;
          --page-text: #e6e1e5;
          --page-muted: #cac4d0;
          --page-background: #1c1b1f;
          --page-border: #49454f;
          --page-code: #2b2930;
        }
      }
      body {
        margin: 0;
        padding: 24px;
        font-family: system-ui, sans-serif;
        color: var(--page-text);
        background: var(--page-background);
      }
      h1 {
        margin-top: 0;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        align-items: center;
        margin-bottom: 24px;
      }
      .gallery {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        gap: 24px;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      figure {
        margin: 0;
        padding: 12px;
        border: 1px solid var(--page-border);
        border-radius: 8px;
      }
      figcaption {
        margin-bottom: 8px;
        font-weight: 600;
      }
      link-view {
        display: block;
        width: 100%;
        height: 200px;
      }
      pre {
        margin: 8px 0 0;
        padding: 8px;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        font-size: 12px;
        color: var(--page-muted);
        background: var(--page-code);
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>link-view gallery</h1>
      <p>
        One link per view, drawn from its Links Notation. Focus a view and press
        <kbd>+</kbd> or <kbd>-</kbd> to zoom, the arrow keys to pan and
        <kbd>0</kbd> to reset; the wheel zooms and a drag pans.
      </p>
      <div class="controls">
        <label
          >Renderer
          <select id="renderer">
            <option value="svg">SVG</option>
            <option value="canvas">Canvas</option>
          </select>
        </label>
        <label
          >Colour scheme
          <select id="theme">
            <option value="">System</option>
            <option value="light">Light</option>
            <option value="dark">Dark</option>
          </select>
        </label>
      </div>
      <ul class="gallery">
        <li>
          <figure id="simple">
            <figcaption>Simple link</figcaption>
            <link-view
              lino="(simple: link-view (link (id 1) (source 1) (target 2)) (markers (source bar) (target arrow)))"
            ></link-view>
          </figure>
        </li>
        <li>
          <figure id="self-loop">
            <figcaption>Self-loop</figcaption>
            <link-view
              lino="(self-loop: link-view (link (id 2) (source 3) (target 3)) (markers (source dot) (target arrow)))"
            ></link-view>
          </figure>
        </li>
        <li>
          <figure id="free-end">
            <figcaption>Free end</figcaption>
            <link-view
              lino="(free-end: link-view (link (id 3) (source 1) (target 0)))"
            ></link-view>
          </figure>
        </li>
        <li>
          <figure id="blueprint">
            <figcaption>Blueprint</figcaption>
            <link-view
              lino="(blueprint: link-view (link (id 1) (source 1) (target 2)) (markers (source bar) (target arrow)) (blueprint true) (grid true))"
            ></link-view>
          </figure>
        </li>
      </ul>
    </main>
    <script type="module" src="./link-view.js"></script>
  </body>
</html>
