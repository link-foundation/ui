<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Links network gallery</title>
    <link rel="icon" href="data:," />
    <script type="importmap">
      {
        "imports": {
          "@link-foundation/ui-core": "/packages/ui-core/src/index.js",
          "@link-foundation/ui-store": "/packages/ui-store/src/index.js",
          "@link-foundation/ui-store/memory": "/packages/ui-store/src/memory.js",
          "@link-foundation/ui-style": "/packages/ui-style/src/index.js",
          "@link-foundation/ui-tokens": "/packages/ui-tokens/src/index.js",
          "@link-foundation/ui-tokens/themes": "/packages/ui-tokens/src/themes/index.js",
          "@link-foundation/ui-dom": "/packages/ui-dom/src/index.js",
          "@dagrejs/dagre": "/node_modules/@dagrejs/dagre/dist/dagre.esm.js",
          "d3-force": "/node_modules/d3-force/src/index.js",
          "d3-dispatch": "/node_modules/d3-dispatch/dist/d3-dispatch.mjs",
          "d3-quadtree": "/node_modules/d3-quadtree/dist/d3-quadtree.mjs",
          "d3-timer": "/node_modules/d3-timer/dist/d3-timer.mjs",
          "links-notation": "/node_modules/links-notation/dist/index.js"
        }
      }
    </script>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
      }
      body {
        max-width: 1000px;
        margin: auto;
        padding: 24px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Doublet configurations</h1>
      <p>Browse every network or one representative of each renaming class.</p>
      <links-gallery size="2" lang="en"></links-gallery>
    </main>
    <script type="module">
      import { defineLinksGallery } from '../src/links-view/links-gallery.js';
      defineLinksGallery();
      const gallery = document.querySelector('links-gallery');
      gallery.urlFor = ({ code, theme }) =>
        `/network/?code=${encodeURIComponent(code.replaceAll(' ', ''))}&theme=${theme ?? 'light'}`;
    </script>
  </body>
</html>
