<form id="login" class="form" action="/login" method="post">
  <h2>Sign in</h2>
  <label for="email">Email</label>
  <input id="email" type="text" name="email" placeholder="you@example.com">
  <label>
    <input type="checkbox" name="remember" checked> Remember me
  </label>
  <textarea name="note" rows="2">Line one
  line two</textarea>
  <button id="ok" class="primary">OK</button>
  <button type="reset" disabled>Cancel</button>
  <input type="submit" value="Send">
</form>
