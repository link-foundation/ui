<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ui-react example</title>
    <style>
      body {
        margin: 0;
        padding: 24px;
        font-family: system-ui, sans-serif;
        color: #1d1b20;
        background: #fffbfe;
      }
      .controls {
        display: flex;
        gap: 12px;
        align-items: center;
        margin-top: 24px;
        padding-top: 16px;
        border-top: 1px solid #cac4d0;
      }
      .counter {
        font: inherit;
        padding: 8px 16px;
      }
      output {
        font-family: ui-monospace, monospace;
      }
      .chart {
        margin: 16px 0 0;
        max-width: 320px;
      }
      .chart svg {
        width: 100%;
        height: 120px;
        fill: #6750a4;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.jsx"></script>
  </body>
</html>
